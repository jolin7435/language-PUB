<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日小考題</title>
    <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            padding: 20px; 
            background-color: #fdfbf7; /* 截圖背景色 */
            color: #4a4a4a;
            max-width: 500px;
            margin: auto;
        }
        h2 { text-align: center; color: #5d4d3c; }
        
        .card { 
            background: #fdf5e6; /* 卡片背景色 */
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            border: 1px solid #eaddca;
        }

        #quiz-word { 
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem; 
            font-weight: bold;
            color: #5d4d3c;
        }

        .option-btn { 
            display: block; 
            width: 100%; 
            padding: 18px; 
            margin-bottom: 15px; 
            border: none; 
            border-radius: 15px; 
            background: #dccab2; /* 選項顏色 */
            color: #5d4d3c; 
            font-size: 1.1rem;
            cursor: pointer; 
            transition: 0.3s;
        }
        .option-btn:hover { background: #c5b096; }

        .nav-container { display: flex; justify-content: space-between; margin-top: 20px; }
        .nav-btn { padding: 10px 20px; border-radius: 10px; border: none; background: #7d6955; color: white; cursor: pointer; }

        /* 進度條樣式 */
        .progress-wrapper { display: flex; align-items: center; gap: 10px; margin: 20px 0; }
        .progress-bar-bg { flex-grow: 1; background: #eaddca; height: 12px; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { background: #7d6955; height: 100%; width: 0%; }
    </style>
</head>
<body>

    <h2>今日小考題</h2>
    
    <div id="quiz-area">
        <div id="quiz-counter" style="text-align:center; margin-bottom: 10px;">題目 1/10</div>
        <div class="card" id="quiz-word">載入中...</div>
        
        <div id="options-container">
            </div>

        <div class="nav-container" id="nav-container">
            <button class="nav-btn" onclick="prevQuiz()">⬅️ 上一題</button>
            <button class="nav-btn" onclick="nextQuiz()">下一題 ➡️</button>
        </div>
    </div>

    <div id="result-card" class="card" style="display:none;">
        <h3>測驗總結</h3>
        <p id="score-text">答對率：0%</p>
        <div class="progress-wrapper">
            <span>等級</span>
            <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar-fill"></div></div>
            <span>N4</span>
        </div>
        <p id="summary-text"></p>
        <button class="nav-btn" onclick="location.reload()">重新開始</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
