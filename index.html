<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日小考題</title>
    <style>
        /* 網頁背景顏色與字體設定 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F7F4E9; /* 溫柔的奶黃色背景 */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* 標題樣式 */
        h1 {
            color: #6C5434; /* 深咖啡色文字 */
            font-size: 24px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* 題目主卡片 */
        .quiz-card {
            background-color: #FFF2CD; /* 亮黃色卡片背景 */
            border-radius: 24px; /* 圓角 */
            padding: 30px 20px 60px 20px;
            box-shadow: 0 4px 12px rgba(220, 210, 180, 0.5); /* 輕微陰影 */
            margin-bottom: 35px;
            position: relative;
        }

        /* 題數計數器（已移除小圖示） */
        .quiz-counter {
            color: #6C5434;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 40px;
        }

        /* 題目文字處 */
        .quiz-word {
            color: #4A371E;
            font-size: 36px;
            font-weight: bold;
            word-wrap: break-word;
            margin: 20px 0;
        }

        /* 讀音（日文專用，英文會自動隱藏） */
        .quiz-reading {
            color: #8C7355;
            font-size: 18px;
            margin-top: -15px;
            margin-bottom: 15px;
        }

        /* 選項按鈕的外觀 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .option-btn {
            background-color: #CDAE81; /* 莫蘭迪棕色按鈕 */
            color: #FFFFFF; /* 白色字體 */
            border: none;
            border-radius: 30px; /* 膠囊狀圓角 */
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(180, 150, 110, 0.3);
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        /* 點擊或懸停時的微調動態效果 */
        .option-btn:active {
            transform: scale(0.98);
            background-color: #BCA073;
        }

        /* 答題反饋樣式 */
        .option-btn.correct {
            background-color: #6B8E23 !important; /* 正確亮綠色 */
        }

        .option-btn.wrong {
            background-color: #CD5C5C !important; /* 錯誤亮紅色 */
        }

        /* 解析區塊外觀 */
        .explanation-card {
            background-color: #FFFFFF;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: none; /* 預設隱藏，答題後顯示 */
        }

        .explanation-title {
            font-weight: bold;
            color: #4A371E;
            margin-bottom: 8px;
        }

        .explanation-text {
            color: #6C5434;
            line-height: 1.5;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>今日小考題</h1>

        <div class="quiz-card">
            <div class="quiz-counter" id="quiz-counter">1/1</div>
            <div class="quiz-word" id="quiz-word">載入中...</div>
            <div class="quiz-reading" id="quiz-reading"></div>
        </div>

        <div class="options-container" id="options-container">
            <button class="option-btn" onclick="checkAnswer(0)">選項 1</button>
            <button class="option-btn" onclick="checkAnswer(1)">選項 2</button>
            <button class="option-btn" onclick="checkAnswer(2)">選項 3</button>
            <button class="option-btn" onclick="checkAnswer(3)">選項 4</button>
        </div>

        <div class="explanation-card" id="explanation-card">
            <div class="explanation-title" id="result-status"></div>
            <div class="explanation-text" id="explanation-text"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
